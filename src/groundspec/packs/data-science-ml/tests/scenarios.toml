[[scenarios]]
id = "core-rules-apply-generally"
description = "The prediction-target and acceptance-criteria rules apply as expected across completion states."
evaluation_kind = "deterministic"
given_evidence = {}
given_contract_fragment = { status = { completion_status = "complete" } }
expect_rules_apply = ["ds-prediction-target-distinct-from-modeling-approach", "ds-acceptance-criteria-measurable-evaluation", "ds-scope-states-non-goals"]

[[scenarios]]
id = "non-goals-rule-not-applicable-at-not-started"
