# Deterministic fixtures for `groundspec pack test data-science-ml`. See
# product-management/tests/scenarios.toml's header for the same
# evaluation_kind discipline.
domain_pack_schema_version = "0.1.0"
pack_id = "data-science-ml"

[[scenarios]]
id = "no-baseline-triggers-incomplete"
description = "A performance claim with no baseline downgrades to INCOMPLETE."
evaluation_kind = "deterministic"
given_evidence = { ds_no_baseline_for_performance_claim = true }
given_contract_fragment = {}
expect_gates_triggered = ["no-baseline-for-performance-claim"]
expect_gates_not_triggered = ["final-test-set-used-for-tuning"]

[[scenarios]]
id = "test-set-tuning-fails"
description = "Using the final test set for tuning forces FAIL."
evaluation_kind = "deterministic"
