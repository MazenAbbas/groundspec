name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests eval scripts
      - run: mypy src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  package:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
      - name: twine check
        run: twine check dist/*
      - name: Scan dist for forbidden artifacts
        run: |
          python - <<'EOF'
          import sys, tarfile, zipfile, glob

          forbidden_markers = (".venv", ".git/", "__pycache__", ".env", "secrets")
          bad = []
          for path in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(path) as zf:
                  for name in zf.namelist():
                      if any(marker in name for marker in forbidden_markers):
                          bad.append((path, name))
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as tf:
                  for name in tf.getnames():
                      if any(marker in name for marker in forbidden_markers):
                          bad.append((path, name))
          if bad:
              print("Forbidden artifacts found in distribution:")
              for path, name in bad:
                  print(f"  {path}: {name}")
              sys.exit(1)
          print("No forbidden artifacts found.")
          EOF
      - name: Clean install into a fresh virtualenv
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/pip install dist/*.whl
          /tmp/clean-install/bin/pip check
          /tmp/clean-install/bin/groundspec --version
          /tmp/clean-install/bin/groundspec doctor
          /tmp/clean-install/bin/groundspec example --out /tmp/gs-example-out
          /tmp/clean-install/bin/groundspec validate /tmp/gs-example-out/write-launch-post.toml
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
